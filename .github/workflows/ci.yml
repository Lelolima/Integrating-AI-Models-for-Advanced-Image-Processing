name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências (PyTorch CPU)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Build (compilação dos módulos)
        run: python -m compileall -q ai-project-structure.py tests
      - name: Testes
        env:
          MPLBACKEND: Agg
        run: pytest -q tests
